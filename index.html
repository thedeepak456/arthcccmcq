<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC Online Exam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- START PAGE -->
<div class="start-page" id="startPage">
    <div class="card">
        <h2>CCC Online Examination</h2>
        <input type="text" id="firstName" placeholder="Enter First Name" class="input-field">
        <input type="text" id="lastName" placeholder="Enter Last Name" class="input-field">
        <button class="start-btn" onclick="startExam()">Start Exam</button>
    </div>
</div>

<!-- QUIZ PAGE -->
<div class="quiz-page" id="quizPage" style="display:none;">

    <header class="header">
        <div>Student: <span id="studentName"></span></div>
        <div>Time Left: <span id="timer">60:00</span></div>
    </header>

    <main class="main">

        <section class="quiz-container">
            <div class="question-box">
                <h3 id="question"></h3>
                <div id="options"></div>

                <div class="navigation">
                    <button class="prev-btn" onclick="prevQuestion()">Previous</button>
                    <button class="next-btn" onclick="nextQuestion()">Next</button>
                    <button class="submit-btn" onclick="submitQuiz()">Submit Exam</button>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <h4>Question Status</h4>
            <div id="questionNumbers"></div>
        </aside>

    </main>

</div>

<script>
// =============================
// QUIZ SCRIPT
// =============================

let timeLeft = 60 * 60;
let timerInterval;

const questions = [

{q:"1. What is computer communication?", options:["Communication between computers","Communication through newspapers","Communication between printers","Communication using only mobile phones"], answer:0},
{q:"2. A computer network is:", options:["A group of connected computers","A type of software","A storage device","An operating system"], answer:0},
{q:"3. Which network covers a small geographical area?", options:["WAN","LAN","MAN","PAN"], answer:1},
{q:"4. Which network covers the largest geographical area?", options:["LAN","PAN","WAN","MAN"], answer:2},
{q:"5. Which device connects multiple computers in a LAN?", options:["Monitor","Switch","Printer","Keyboard"], answer:1},

{q:"6. Which device converts digital signals into analog signals for Internet access?", options:["Scanner","Modem","Projector","Plotter"], answer:1},
{q:"7. Which topology connects all devices to a central device?", options:["Ring","Bus","Star","Mesh"], answer:2},
{q:"8. Which topology forms a closed loop?", options:["Ring","Star","Tree","Bus"], answer:0},
{q:"9. Which topology uses a single backbone cable?", options:["Bus","Star","Mesh","Tree"], answer:0},
{q:"10. Which protocol is responsible for communication over the Internet?", options:["TCP/IP","SMTP","FTP","HTML"], answer:0},

{q:"11. What does IP stand for?", options:["Internet Protocol","Internal Program","Input Process","Internet Program"], answer:0},
{q:"12. Which protocol is used to transfer web pages?", options:["FTP","HTTP","SMTP","POP3"], answer:1},
{q:"13. Which protocol is used for secure web communication?", options:["HTTP","HTTPS","FTP","SMTP"], answer:1},
{q:"14. Which protocol is mainly used for file transfer?", options:["FTP","HTTP","SMTP","DNS"], answer:0},
{q:"15. Which protocol is used to send emails?", options:["SMTP","FTP","POP3","HTTP"], answer:0},

{q:"16. Which protocol is commonly used to receive emails?", options:["POP3","HTTP","FTP","TCP"], answer:0},
{q:"17. DNS stands for:", options:["Domain Name System","Data Name Service","Digital Network Server","Domain Network Security"], answer:0},
{q:"18. What is the Internet?", options:["A local network","A worldwide network of networks","A software package","A browser"], answer:1},
{q:"19. Which of the following is NOT an Internet service?", options:["Email","Web Browsing","Video Conferencing","Disk Defragmentation"], answer:3},
{q:"20. ISP stands for:", options:["Internet Service Provider","Internet Security Program","Internal Service Point","Information System Provider"], answer:0},

{q:"21. WWW stands for:", options:["World Wide Web","Wide World Web","Web Wide World","World Web Window"], answer:0},
{q:"22. A website is:", options:["A collection of related web pages","A browser","A search engine","An operating system"], answer:0},
{q:"23. The first page of a website is called:", options:["Home Page","Main Folder","Index File","Cover Page"], answer:0},
{q:"24. HTML stands for:", options:["Hyper Text Markup Language","High Text Machine Language","Hyper Transfer Markup Language","Hyperlink Text Markup Language"], answer:0},
{q:"25. Which of the following is a web browser?", options:["Google Chrome","Google","Yahoo","Bing"], answer:0},

{q:"26. Which browser is developed by Microsoft?", options:["Chrome","Firefox","Edge","Safari"], answer:2},
{q:"27. Which browser is developed by Mozilla?", options:["Firefox","Chrome","Opera","Edge"], answer:0},
{q:"28. Which browser is developed by Apple?", options:["Safari","Opera","Firefox","Edge"], answer:0},
{q:"29. A browser is used to:", options:["Create websites","Access web pages","Scan viruses","Edit videos"], answer:1},
{q:"30. URL stands for:", options:["Uniform Resource Locator","Universal Resource Link","Uniform Reference Locator","Universal Reference Link"], answer:0},

{q:"31. Which part of a URL identifies the protocol?", options:["https://","www","com","index"], answer:0},
{q:"32. Which domain is commonly used by commercial organizations?", options:[".gov",".edu",".com",".org"], answer:2},
{q:"33. Which domain is used by government organizations?", options:[".gov",".edu",".net",".org"], answer:0},
{q:"34. Which domain is mainly used by educational institutions?", options:[".edu",".org",".gov",".com"], answer:0},
{q:"35. Which domain is generally used by non-profit organizations?", options:[".org",".edu",".gov",".com"], answer:0},

{q:"36. A search engine is used to:", options:["Browse files","Search information on the Internet","Create emails","Install software"], answer:1},
{q:"37. Which of the following is a search engine?", options:["Google","Windows","Linux","MS Word"], answer:0},
{q:"38. Which button refreshes a web page?", options:["Reload/Refresh","Home","Back","Forward"], answer:0},
{q:"39. Which button returns to the previously visited page?", options:["Forward","Back","Refresh","Home"], answer:1},
{q:"40. Bookmarks in a browser are used to:", options:["Save favorite websites","Delete websites","Block websites","Download websites"], answer:0},

{q:"41. Which symbol is compulsory in an email address?", options:["#","@","&","$"], answer:1},
{q:"42. Which of the following is an email service?", options:["Gmail","Photoshop","Excel","Paint"], answer:0},
{q:"43. CC in email stands for:", options:["Carbon Copy","Computer Copy","Control Copy","Central Copy"], answer:0},
{q:"44. BCC in email stands for:", options:["Blind Carbon Copy","Browser Carbon Copy","Basic Carbon Copy","Binary Carbon Copy"], answer:0},
{q:"45. Which field contains the recipient's email address?", options:["To","Subject","Signature","Attachment"], answer:0},

{q:"46. Which option is used to attach a file in an email?", options:["Attachment","Reply","Forward","Delete"], answer:0},
{q:"47. Which communication tool is commonly used for online meetings?", options:["Google Meet","Paint","Notepad","Calculator"], answer:0},
{q:"48. Which application is used for video conferencing?", options:["Zoom","MS Paint","WordPad","VLC"], answer:0},
{q:"49. Which of the following is an instant messaging application?", options:["WhatsApp","PowerPoint","Excel","Access"], answer:0},
{q:"50. Which platform is mainly used for professional networking?", options:["LinkedIn","Instagram","Paint","Calculator"], answer:0},

{q:"51. Google Drive is an example of:", options:["Cloud Storage","Operating System","Web Browser","Search Engine"], answer:0},
{q:"52. Cloud computing allows users to:", options:["Store and access data over the Internet","Repair computers","Install RAM","Format hard disks"], answer:0},
{q:"53. Which service allows multiple users to edit a document together?", options:["Google Docs","Paint","WordPad","Calculator"], answer:0},
{q:"54. Collaboration means:", options:["Working together on a common task","Deleting files","Installing software","Formatting disks"], answer:0},
{q:"55. Which feature lets multiple users work on the same online document?", options:["Real-time Collaboration","Disk Cleanup","Defragmentation","Backup"], answer:0},

{q:"56. Which service is commonly used to share files online?", options:["Google Drive","MS Paint","Calculator","Notepad"], answer:0},
{q:"57. Which communication method provides immediate text conversation?", options:["Instant Messaging","Postal Mail","Fax","Courier"], answer:0},
{q:"58. Which of the following is an example of social media?", options:["Facebook","MS Excel","Paint","Access"], answer:0},
{q:"59. Which communication method uses voice and video over the Internet?", options:["Video Conferencing","Printing","Scanning","Photocopying"], answer:0},
{q:"60. Which is a good practice while using Internet communication?", options:["Share passwords","Click unknown links","Use strong passwords","Disable antivirus"], answer:2}

];
let currentQuestion=0;
let userAnswers=new Array(questions.length).fill(null);
let visited=new Array(questions.length).fill(false);

function startExam(){
    const first = document.getElementById("firstName").value.trim();
    const last = document.getElementById("lastName").value.trim();

    if(first === "" || last === ""){ 
        alert("Enter First & Last Name"); 
        return; 
    }

    // Store in localStorage for result page
    localStorage.setItem("firstName", first);
    localStorage.setItem("lastName", last);

    document.getElementById("studentName").innerText = first + " " + last;
    document.getElementById("startPage").style.display = "none";
    document.getElementById("quizPage").style.display = "block";

    startTimer();
    loadQuestion();
}


function startTimer(){
    timerInterval=setInterval(()=>{
        let m=Math.floor(timeLeft/60);
        let s=timeLeft%60;
        document.getElementById("timer").innerText=`${m}:${s<10?"0"+s:s}`;
        timeLeft--;
        if(timeLeft<0){ clearInterval(timerInterval); submitQuiz(); }
    },1000);
}

function loadQuestion(){
    visited[currentQuestion]=true;
    document.getElementById("question").innerText=questions[currentQuestion].q;

    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    questions[currentQuestion].options.forEach((opt,i)=>{
        const checked=userAnswers[currentQuestion]===i?"checked":"";        
        optDiv.innerHTML+=`
        <label>
            <input type="radio" name="option" value="${i}" ${checked}>
            <span>${opt}</span>
        </label>`;
    });

    updateSidebar();
}

function saveAnswer(){
    const selected=document.querySelector('input[name="option"]:checked');
    if(selected) userAnswers[currentQuestion]=parseInt(selected.value);
}

function nextQuestion(){ saveAnswer(); if(currentQuestion<questions.length-1){currentQuestion++; loadQuestion();} }
function prevQuestion(){ saveAnswer(); if(currentQuestion>0){currentQuestion--; loadQuestion();} }

function updateSidebar(){
    const container=document.getElementById("questionNumbers");
    container.innerHTML="";
    questions.forEach((_,i)=>{
        let cls="q-number";
        if(userAnswers[i]!==null) cls+=" answered";
        else if(visited[i]) cls+=" skipped";
        container.innerHTML+=`<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;
    });
}

function goTo(i){ saveAnswer(); currentQuestion=i; loadQuestion(); }

function submitQuiz(){
    saveAnswer(); clearInterval(timerInterval);
    let score=0;
    questions.forEach((q,i)=>{ if(userAnswers[i]===q.answer) score++; });
    localStorage.setItem("score",score);
    localStorage.setItem("total",questions.length);
    localStorage.setItem("answers",JSON.stringify(userAnswers));
    localStorage.setItem("questions",JSON.stringify(questions));
    window.location.href="result.html";
}

document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ alert("Tab changed! Exam submitted."); submitQuiz(); }
});
</script>

</body>
</html>
