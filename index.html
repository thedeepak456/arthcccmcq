<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC Online Exam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- START PAGE -->
<div class="start-page" id="startPage">
    <div class="card">
        <h2>CCC Online Examination</h2>
        <input type="text" id="firstName" placeholder="Enter First Name" class="input-field">
        <input type="text" id="lastName" placeholder="Enter Last Name" class="input-field">
        <button class="start-btn" onclick="startExam()">Start Exam</button>
    </div>
</div>

<!-- QUIZ PAGE -->
<div class="quiz-page" id="quizPage" style="display:none;">

    <header class="header">
        <div>Student: <span id="studentName"></span></div>
        <div>Time Left: <span id="timer">60:00</span></div>
    </header>

    <main class="main">

        <section class="quiz-container">
            <div class="question-box">
                <h3 id="question"></h3>
                <div id="options"></div>

                <div class="navigation">
                    <button class="prev-btn" onclick="prevQuestion()">Previous</button>
                    <button class="next-btn" onclick="nextQuestion()">Next</button>
                    <button class="submit-btn" onclick="submitQuiz()">Submit Exam</button>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <h4>Question Status</h4>
            <div id="questionNumbers"></div>
        </aside>

    </main>

</div>

<script>
// =============================
// QUIZ SCRIPT
// =============================

let timeLeft = 60 * 60;
let timerInterval;

const questions = [

{q:"51. Which layer of the TCP/IP model is responsible for routing packets between networks?", options:["Application Layer","Transport Layer","Internet Layer","Network Access Layer"], answer:2},
{q:"52. What is the default port number used by HTTPS?", options:["21","25","443","110"], answer:2},
{q:"53. Which protocol automatically assigns IP addresses to devices on a network?", options:["DNS","DHCP","SMTP","ARP"], answer:1},
{q:"54. Which of the following is a valid IPv4 address?", options:["192.168.1.256","172.16.5.10","300.10.1.1","192.168.1"], answer:1},
{q:"55. The primary purpose of DNS is to:", options:["Encrypt data","Translate domain names into IP addresses","Transfer files","Send emails"], answer:1},

{q:"56. Which device operates mainly at the Data Link Layer of the OSI model?", options:["Switch","Router","Gateway","Modem"], answer:0},
{q:"57. What does the term 'packet switching' mean?", options:["Dedicated communication path","Data divided into small units for transmission","Signal amplification","Wireless communication"], answer:1},
{q:"58. Which protocol is used to securely transfer files over the Internet?", options:["FTP","HTTP","SFTP","POP3"], answer:2},
{q:"59. What is the function of ARP?", options:["Find MAC address from IP address","Assign IP addresses","Send emails","Translate URLs"], answer:0},
{q:"60. Which topology connects all devices to a central hub or switch?", options:["Ring","Bus","Star","Mesh"], answer:2},

{q:"61. Which protocol is connection-oriented?", options:["UDP","IP","ICMP","TCP"], answer:3},
{q:"62. What is the main advantage of fiber optic cables?", options:["Low bandwidth","High-speed data transmission","Wireless communication","Low security"], answer:1},
{q:"63. A MAC address is usually represented in:", options:["Decimal format","Hexadecimal format","Binary only","Octal format"], answer:1},
{q:"64. Which of the following is an example of a private IP address?", options:["8.8.8.8","172.20.10.5","1.1.1.1","64.233.160.0"], answer:1},
{q:"65. Which protocol is commonly used for network diagnostics?", options:["ICMP","SMTP","POP3","FTP"], answer:0},

{q:"66. What is the purpose of a proxy server?", options:["Increase monitor resolution","Act as an intermediary between client and server","Replace DNS","Store passwords"], answer:1},
{q:"67. Which network topology provides the highest fault tolerance?", options:["Bus","Star","Mesh","Ring"], answer:2},
{q:"68. What is the full form of VPN?", options:["Virtual Private Network","Verified Public Network","Virtual Protocol Node","Variable Private Node"], answer:0},
{q:"69. Which protocol is generally used for receiving emails while keeping them on the server?", options:["POP3","IMAP","SMTP","ARP"], answer:1},
{q:"70. Which attack floods a server with excessive requests?", options:["Phishing","Spoofing","DoS","Sniffing"], answer:2},

{q:"71. Which of the following is NOT a web browser?", options:["Firefox","Opera","Apache","Edge"], answer:2},
{q:"72. The command 'ping' is used to:", options:["Test network connectivity","Transfer files","Configure routers","Encrypt data"], answer:0},
{q:"73. What does URL primarily identify?", options:["A hardware device","A resource on the Internet","A network cable","An email account"], answer:1},
{q:"74. Which organization developed the World Wide Web?", options:["NASA","CERN","UNESCO","IBM"], answer:1},
{q:"75. What is the main function of a gateway?", options:["Connect dissimilar networks","Store web pages","Assign passwords","Manage printers"], answer:0},

{q:"76. Which of the following is an example of real-time communication?", options:["Email","Discussion Forum","Video Conference","Blog"], answer:2},
{q:"77. What is the purpose of cookies in web browsing?", options:["Store user preferences","Increase CPU speed","Encrypt files","Provide IP addresses"], answer:0},
{q:"78. Which protocol is commonly used for video streaming on the web?", options:["HTTP/HTTPS","ARP","ICMP","SMTP"], answer:0},
{q:"79. In networking, bandwidth is usually measured in:", options:["Pixels","Bits per second","Bytes per folder","Hertz only"], answer:1},
{q:"80. Which layer of the OSI model handles end-to-end communication?", options:["Network","Transport","Session","Physical"], answer:1},

{q:"81. Which cyber threat secretly records user activities?", options:["Spyware","Firewall","Switch","Proxy"], answer:0},
{q:"82. What is the primary purpose of HTTPS certificates?", options:["Increase speed","Authenticate and secure communication","Store web pages","Assign IP addresses"], answer:1},
{q:"83. Which Internet service allows users to access files stored remotely?", options:["Cloud Storage","Compiler","Antivirus","Spreadsheet"], answer:0},
{q:"84. What is the default port number for HTTP?", options:["443","80","21","25"], answer:1},
{q:"85. Which protocol is responsible for translating private IP addresses to public IP addresses?", options:["NAT","SMTP","IMAP","FTP"], answer:0},

{q:"86. Which type of malware demands payment to restore access to data?", options:["Trojan","Spyware","Ransomware","Adware"], answer:2},
{q:"87. What is the purpose of two-factor authentication (2FA)?", options:["Reduce security","Provide an extra security layer","Increase bandwidth","Speed up login"], answer:1},
{q:"88. Which networking device can filter traffic based on MAC addresses?", options:["Switch","Modem","Repeater","Hub"], answer:0},
{q:"89. What does the term 'latency' refer to?", options:["Transmission delay","Storage size","Screen resolution","Signal strength"], answer:0},
{q:"90. Which protocol is used to resolve domain names?", options:["DHCP","DNS","FTP","POP3"], answer:1},

{q:"91. Which of the following best describes cloud computing?", options:["Local storage only","On-demand computing services over the Internet","A type of router","An email protocol"], answer:1},
{q:"92. What is a major benefit of video conferencing?", options:["Requires no Internet","Real-time remote collaboration","Eliminates communication","Works only on LAN"], answer:1},
{q:"93. Which cyberattack involves creating a fake website to steal credentials?", options:["Phishing","Defragmentation","Caching","Compression"], answer:0},
{q:"94. Which technology enables contactless payments using smartphones?", options:["NFC","FTP","ARP","SMTP"], answer:0},
{q:"95. What is the primary purpose of an SSL/TLS protocol?", options:["File transfer","Secure communication","Printer sharing","IP allocation"], answer:1},

{q:"96. Which command displays the IP configuration of a Windows computer?", options:["ping","tracert","ipconfig","netstat"], answer:2},
{q:"97. Which of the following is a valid example of a domain name?", options:["192.168.1.1","google.com","255.255.255.0","8080"], answer:1},
{q:"98. Which communication mode allows transmission in only one direction?", options:["Simplex","Half Duplex","Full Duplex","Multiplex"], answer:0},
{q:"99. Which device regenerates weak signals in a network?", options:["Router","Switch","Repeater","Gateway"], answer:2},
{q:"100. Which of the following is considered a strong password?", options:["12345678","password","Deepak@2026#X7","abcdef"], answer:2}

];
let currentQuestion=0;
let userAnswers=new Array(questions.length).fill(null);
let visited=new Array(questions.length).fill(false);

function startExam(){
    const first = document.getElementById("firstName").value.trim();
    const last = document.getElementById("lastName").value.trim();

    if(first === "" || last === ""){ 
        alert("Enter First & Last Name"); 
        return; 
    }

    // Store in localStorage for result page
    localStorage.setItem("firstName", first);
    localStorage.setItem("lastName", last);

    document.getElementById("studentName").innerText = first + " " + last;
    document.getElementById("startPage").style.display = "none";
    document.getElementById("quizPage").style.display = "block";

    startTimer();
    loadQuestion();
}


function startTimer(){
    timerInterval=setInterval(()=>{
        let m=Math.floor(timeLeft/60);
        let s=timeLeft%60;
        document.getElementById("timer").innerText=`${m}:${s<10?"0"+s:s}`;
        timeLeft--;
        if(timeLeft<0){ clearInterval(timerInterval); submitQuiz(); }
    },1000);
}

function loadQuestion(){
    visited[currentQuestion]=true;
    document.getElementById("question").innerText=questions[currentQuestion].q;

    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    questions[currentQuestion].options.forEach((opt,i)=>{
        const checked=userAnswers[currentQuestion]===i?"checked":"";        
        optDiv.innerHTML+=`
        <label>
            <input type="radio" name="option" value="${i}" ${checked}>
            <span>${opt}</span>
        </label>`;
    });

    updateSidebar();
}

function saveAnswer(){
    const selected=document.querySelector('input[name="option"]:checked');
    if(selected) userAnswers[currentQuestion]=parseInt(selected.value);
}

function nextQuestion(){ saveAnswer(); if(currentQuestion<questions.length-1){currentQuestion++; loadQuestion();} }
function prevQuestion(){ saveAnswer(); if(currentQuestion>0){currentQuestion--; loadQuestion();} }

function updateSidebar(){
    const container=document.getElementById("questionNumbers");
    container.innerHTML="";
    questions.forEach((_,i)=>{
        let cls="q-number";
        if(userAnswers[i]!==null) cls+=" answered";
        else if(visited[i]) cls+=" skipped";
        container.innerHTML+=`<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;
    });
}

function goTo(i){ saveAnswer(); currentQuestion=i; loadQuestion(); }

function submitQuiz(){
    saveAnswer(); clearInterval(timerInterval);
    let score=0;
    questions.forEach((q,i)=>{ if(userAnswers[i]===q.answer) score++; });
    localStorage.setItem("score",score);
    localStorage.setItem("total",questions.length);
    localStorage.setItem("answers",JSON.stringify(userAnswers));
    localStorage.setItem("questions",JSON.stringify(questions));
    window.location.href="result.html";
}

document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ alert("Tab changed! Exam submitted."); submitQuiz(); }
});
</script>

</body>
</html>
