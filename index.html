<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC Online Exam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- START PAGE -->
<div class="start-page" id="startPage">
    <div class="card">
        <h2>CCC Online Examination</h2>
        <input type="text" id="firstName" placeholder="Enter First Name" class="input-field">
        <input type="text" id="lastName" placeholder="Enter Last Name" class="input-field">
        <button class="start-btn" onclick="startExam()">Start Exam</button>
    </div>
</div>

<!-- QUIZ PAGE -->
<div class="quiz-page" id="quizPage" style="display:none;">

    <header class="header">
        <div>Student: <span id="studentName"></span></div>
        <div>Time Left: <span id="timer">60:00</span></div>
    </header>

    <main class="main">

        <section class="quiz-container">
            <div class="question-box">
                <h3 id="question"></h3>
                <div id="options"></div>

                <div class="navigation">
                    <button class="prev-btn" onclick="prevQuestion()">Previous</button>
                    <button class="next-btn" onclick="nextQuestion()">Next</button>
                    <button class="submit-btn" onclick="submitQuiz()">Submit Exam</button>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <h4>Question Status</h4>
            <div id="questionNumbers"></div>
        </aside>

    </main>

</div>

<script>
// =============================
// QUIZ SCRIPT
// =============================

let timeLeft = 60 * 60;
let timerInterval;

const questions = [

{q:"1. Which protocol is primarily used for sending e-mails?", options:["HTTP","SMTP","FTP","POP3"], answer:1},
{q:"2. The full form of DNS is:", options:["Data Network Service","Domain Name System","Digital Network Server","Domain Navigation Service"], answer:1},
{q:"3. Which of the following is NOT an Internet protocol?", options:["FTP","SMTP","CPU","HTTP"], answer:2},
{q:"4. What is the main purpose of a firewall?", options:["Store files","Increase speed","Protect network","Print documents"], answer:2},
{q:"5. Which service allows voice communication over the Internet?", options:["VoIP","DNS","FTP","HTML"], answer:0},

{q:"6. Uploading means:", options:["Receiving data","Deleting data","Sending data to another computer","Scanning documents"], answer:2},
{q:"7. Which network covers countries and continents?", options:["LAN","WAN","PAN","CAN"], answer:1},
{q:"8. Every device connected to a network has a unique:", options:["IP Address","Folder Name","Password","Username"], answer:0},
{q:"9. Which of these is a valid domain extension?", options:[".doc",".com",".ppt",".exe"], answer:1},
{q:"10. Retrieving a webpage from a web server is called:", options:["Streaming","Browsing","Hosting","Fetching"], answer:3},

{q:"11. Which transmission medium uses light pulses?", options:["Coaxial Cable","Twisted Pair","Fiber Optic Cable","Telephone Line"], answer:2},
{q:"12. Secure web communication uses:", options:["FTP","HTTPS","SMTP","POP3"], answer:1},
{q:"13. Which organization coordinates domain names worldwide?", options:["UNESCO","WTO","ICANN","NIELIT"], answer:2},
{q:"14. A group of connected computers is known as a:", options:["Protocol","Network","Database","Browser"], answer:1},
{q:"15. Which technology is commonly used for short-range wireless file transfer?", options:["Bluetooth","Router","Modem","Scanner"], answer:0},

{q:"16. A modem is used to:", options:["Store data","Convert digital and analog signals","Print documents","Create websites"], answer:1},
{q:"17. Fraudulent attempts to obtain personal information online are called:", options:["Routing","Caching","Phishing","Indexing"], answer:2},
{q:"18. URL stands for:", options:["Uniform Resource Locator","Universal Routing Link","Unified Resource Location","Uniform Routing Locator"], answer:0},
{q:"19. Which service provides online file storage?", options:["Notepad","Google Drive","Paint","Calculator"], answer:1},
{q:"20. Which device directs data packets between different networks?", options:["Switch","Repeater","Router","Hub"], answer:2},

{q:"21. Sent emails are normally stored in:", options:["Spam","Inbox","Drafts","Sent Items"], answer:3},
{q:"22. POP stands for:", options:["Post Office Protocol","Private Online Protocol","Public Office Program","Post Online Package"], answer:0},
{q:"23. Finding information using keywords on the Internet is called:", options:["Searching","Formatting","Encoding","Compiling"], answer:0},
{q:"24. An ISP provides:", options:["Printers","Internet access","Scanners","Projectors"], answer:1},
{q:"25. Which device forwards packets based on IP addresses?", options:["Router","Mouse","Speaker","Monitor"], answer:0},

{q:"26. Cyber bullying refers to:", options:["Online harassment","Web designing","Virus scanning","Data backup"], answer:0},
{q:"27. Web pages are transferred using:", options:["SMTP","FTP","HTTP","DNS"], answer:2},
{q:"28. A browser is mainly used to:", options:["Create spreadsheets","Access websites","Edit videos","Develop hardware"], answer:1},
{q:"29. Communication in both directions simultaneously is:", options:["Half Duplex","Simplex","Offline","Full Duplex"], answer:3},
{q:"30. Which is an example of an e-Governance service?", options:["Online tax filing","Newspaper reading","Handwritten application","Notice board"], answer:0},

{q:"31. Data sent across a network is broken into:", options:["Folders","Packets","Windows","Domains"], answer:1},
{q:"32. Which wireless technology is commonly used for Internet access?", options:["USB","Wi-Fi","HDMI","VGA"], answer:1},
{q:"33. CAPTCHA is used to:", options:["Speed up browsing","Verify human users","Transfer files","Encrypt emails"], answer:1},
{q:"34. Delay in network communication is called:", options:["Bandwidth","Caching","Latency","Buffering"], answer:2},
{q:"35. Which protocol allows remote login to another computer?", options:["HTML","SMTP","DNS","Telnet"], answer:3},

{q:"36. Netiquette refers to:", options:["Internet etiquette","Network cable","Email account","Web browser"], answer:0},
{q:"37. Which medium offers the highest data transmission speed?", options:["Telephone Wire","Bluetooth","Fiber Optic Cable","Infrared"], answer:2},
{q:"38. Which application is commonly used for video conferencing?", options:["Zoom","Paint","Excel","WordPad"], answer:0},
{q:"39. Encryption is mainly used for:", options:["Data security","Printing","Scanning","Downloading"], answer:0},
{q:"40. A LAN generally covers:", options:["A city","A country","The world","A limited local area"], answer:3},

{q:"41. Bandwidth indicates:", options:["Storage capacity","Data transfer capacity","CPU speed","Monitor resolution"], answer:1},
{q:"42. Which service helps users locate information on the web?", options:["Search Engine","Compiler","Device Driver","Antivirus"], answer:0},
{q:"43. A repeater is used to:", options:["Store data","Boost network signals","Create websites","Scan files"], answer:1},
{q:"44. Clicking unknown links may result in:", options:["Malware infection","Better security","More bandwidth","Faster downloads"], answer:0},
{q:"45. Which protocol is commonly used to receive emails?", options:["FTP","HTTP","POP3","HTML"], answer:2},

{q:"46. An intranet is a:", options:["Private organizational network","Search engine","Social media platform","Web browser"], answer:0},
{q:"47. Online buying and selling of goods is called:", options:["E-Learning","E-Commerce","E-Banking","E-Governance"], answer:1},
{q:"48. Which symbol separates the user name and domain in an e-mail address?", options:["#","@","&","%"], answer:1},
{q:"49. Protecting systems and networks from digital attacks is known as:", options:["Networking","Cyber Security","Web Hosting","Programming"], answer:1},
{q:"50. Which of the following is an example of cloud computing service?", options:["Google Drive","MS Paint","WordPad","Notepad"], answer:0}

];

let currentQuestion=0;
let userAnswers=new Array(questions.length).fill(null);
let visited=new Array(questions.length).fill(false);

function startExam(){
    const first = document.getElementById("firstName").value.trim();
    const last = document.getElementById("lastName").value.trim();

    if(first === "" || last === ""){ 
        alert("Enter First & Last Name"); 
        return; 
    }

    // Store in localStorage for result page
    localStorage.setItem("firstName", first);
    localStorage.setItem("lastName", last);

    document.getElementById("studentName").innerText = first + " " + last;
    document.getElementById("startPage").style.display = "none";
    document.getElementById("quizPage").style.display = "block";

    startTimer();
    loadQuestion();
}


function startTimer(){
    timerInterval=setInterval(()=>{
        let m=Math.floor(timeLeft/60);
        let s=timeLeft%60;
        document.getElementById("timer").innerText=`${m}:${s<10?"0"+s:s}`;
        timeLeft--;
        if(timeLeft<0){ clearInterval(timerInterval); submitQuiz(); }
    },1000);
}

function loadQuestion(){
    visited[currentQuestion]=true;
    document.getElementById("question").innerText=questions[currentQuestion].q;

    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    questions[currentQuestion].options.forEach((opt,i)=>{
        const checked=userAnswers[currentQuestion]===i?"checked":"";        
        optDiv.innerHTML+=`
        <label>
            <input type="radio" name="option" value="${i}" ${checked}>
            <span>${opt}</span>
        </label>`;
    });

    updateSidebar();
}

function saveAnswer(){
    const selected=document.querySelector('input[name="option"]:checked');
    if(selected) userAnswers[currentQuestion]=parseInt(selected.value);
}

function nextQuestion(){ saveAnswer(); if(currentQuestion<questions.length-1){currentQuestion++; loadQuestion();} }
function prevQuestion(){ saveAnswer(); if(currentQuestion>0){currentQuestion--; loadQuestion();} }

function updateSidebar(){
    const container=document.getElementById("questionNumbers");
    container.innerHTML="";
    questions.forEach((_,i)=>{
        let cls="q-number";
        if(userAnswers[i]!==null) cls+=" answered";
        else if(visited[i]) cls+=" skipped";
        container.innerHTML+=`<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;
    });
}

function goTo(i){ saveAnswer(); currentQuestion=i; loadQuestion(); }

function submitQuiz(){
    saveAnswer(); clearInterval(timerInterval);
    let score=0;
    questions.forEach((q,i)=>{ if(userAnswers[i]===q.answer) score++; });
    localStorage.setItem("score",score);
    localStorage.setItem("total",questions.length);
    localStorage.setItem("answers",JSON.stringify(userAnswers));
    localStorage.setItem("questions",JSON.stringify(questions));
    window.location.href="result.html";
}

document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ alert("Tab changed! Exam submitted."); submitQuiz(); }
});
</script>

</body>
</html>
