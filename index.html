<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC Online Exam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- START PAGE -->
<div class="start-page" id="startPage">
    <div class="card">
        <h2>CCC Online Examination</h2>
        <input type="text" id="firstName" placeholder="Enter First Name" class="input-field">
        <input type="text" id="lastName" placeholder="Enter Last Name" class="input-field">
        <button class="start-btn" onclick="startExam()">Start Exam</button>
    </div>
</div>

<!-- QUIZ PAGE -->
<div class="quiz-page" id="quizPage" style="display:none;">

    <header class="header">
        <div>Student: <span id="studentName"></span></div>
        <div>Time Left: <span id="timer">60:00</span></div>
    </header>

    <main class="main">

        <section class="quiz-container">
            <div class="question-box">
                <h3 id="question"></h3>
                <div id="options"></div>

                <div class="navigation">
                    <button class="prev-btn" onclick="prevQuestion()">Previous</button>
                    <button class="next-btn" onclick="nextQuestion()">Next</button>
                    <button class="submit-btn" onclick="submitQuiz()">Submit Exam</button>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <h4>Question Status</h4>
            <div id="questionNumbers"></div>
        </aside>

    </main>

</div>

<script>
// =============================
// QUIZ SCRIPT
// =============================

let timeLeft = 60 * 60;
let timerInterval;

const questions = [

{q:"1. Which of the following is an Operating System?", options:["MS Word","Windows 11","PowerPoint","Excel"], answer:1},
{q:"2. Which feature allows running multiple programs simultaneously?", options:["Formatting","Multitasking","Printing","Searching"], answer:1},
{q:"3. Which shortcut key is used to switch between open applications in Windows?", options:["Ctrl + P","Alt + Tab","Ctrl + C","Ctrl + A"], answer:1},
{q:"4. The Recycle Bin is used to:", options:["Store viruses","Permanently delete files","Temporarily store deleted files","Create folders"], answer:2},
{q:"5. Which file extension represents an executable file in Windows?", options:[".txt",".jpg",".docx",".exe"], answer:3},

{q:"6. Which shortcut key is used to save a document?", options:["Ctrl + S","Ctrl + P","Ctrl + X","Ctrl + N"], answer:0},
{q:"7. Which option is used to merge multiple cells in a table?", options:["Split Cells","Merge Cells","Insert Cells","Delete Cells"], answer:1},
{q:"8. Which shortcut key makes selected text bold?", options:["Ctrl + U","Ctrl + B","Ctrl + I","Ctrl + E"], answer:1},
{q:"9. Which alignment places text equally between left and right margins?", options:["Left","Center","Right","Justify"], answer:3},
{q:"10. Which feature automatically corrects common typing errors?", options:["Word Count","AutoCorrect","Find","Zoom"], answer:1},

{q:"11. Which shortcut key is used to copy selected text?", options:["Ctrl + X","Ctrl + C","Ctrl + V","Ctrl + A"], answer:1},
{q:"12. Which shortcut key is used to paste copied text?", options:["Ctrl + V","Ctrl + P","Ctrl + X","Ctrl + N"], answer:0},
{q:"13. Which tab contains the option to insert page numbers?", options:["Home","Review","Insert","Layout"], answer:2},
{q:"14. Which feature is used to find and replace text?", options:["AutoCorrect","Mail Merge","Find and Replace","Word Count"], answer:2},
{q:"15. Which view displays the document as it will appear when printed?", options:["Draft View","Print Layout View","Web Layout View","Outline View"], answer:1},

{q:"16. A spreadsheet is mainly used for:", options:["Drawing pictures","Playing games","Calculations and data analysis","Internet browsing"], answer:2},
{q:"17. Which symbol is used to begin a formula in Calc/Excel?", options:["@","#","=","%"], answer:2},
{q:"18. Which function calculates the average of selected values?", options:["SUM()","AVG()","AVERAGE()","COUNT()"], answer:2},
{q:"19. A cell address consists of:", options:["Row number only","Column name only","Column letter and row number","Formula and function"], answer:2},
{q:"20. Which chart is best for showing percentages of a whole?", options:["Bar Chart","Pie Chart","Line Chart","Scatter Chart"], answer:1},

{q:"21. Which function returns the largest value in a range?", options:["MIN()","MAX()","COUNT()","SUM()"], answer:1},
{q:"22. Which key is used to edit the contents of the active cell?", options:["F1","F2","F5","F7"], answer:1},
{q:"23. Which feature keeps rows or columns visible while scrolling?", options:["Freeze Panes","Split Panes","Grouping","Sorting"], answer:0},
{q:"24. Which formula calculates the total of cells A1 to A10?", options:["=COUNT(A1:A10)","=AVG(A1:A10)","=SUM(A1:A10)","=MAX(A1:A10)"], answer:2},
{q:"25. Which feature restricts the type of data entered into cells?", options:["Data Validation","Conditional Formatting","Sorting","Filtering"], answer:0},

{q:"26. Which software is used for creating presentations?", options:["Calc","Writer","Impress","Paint"], answer:2},
{q:"27. Which key starts the slideshow from the beginning?", options:["F1","F5","F7","F12"], answer:1},
{q:"28. What is the purpose of Slide Transition?", options:["To edit text","To add effects between slides","To insert tables","To save presentations"], answer:1},
{q:"29. Which view is best for rearranging slides?", options:["Normal View","Slide Sorter View","Notes View","Reading View"], answer:1},
{q:"30. Which option is used to insert a picture into a presentation?", options:["Review → Spelling","Insert → Image","View → Zoom","Format → Paragraph"], answer:1},

{q:"31. What does HTTP stand for?", options:["Hyper Text Transfer Protocol","Hyper Transfer Text Program","High Text Transfer Protocol","Hyper Text Translate Program"], answer:0},
{q:"32. Which of the following is a web browser?", options:["Gmail","Google Chrome","Windows","Linux"], answer:1},
{q:"33. Which device connects a computer to the Internet?", options:["Scanner","Modem","Speaker","Plotter"], answer:1},
{q:"34. Which domain is generally used by educational institutions?", options:[".com",".gov",".edu",".org"], answer:2},
{q:"35. Which protocol is used for transferring files over the Internet?", options:["SMTP","HTTP","FTP","POP3"], answer:2},

{q:"36. What does URL stand for?", options:["Uniform Resource Locator","Universal Resource Link","Uniform Reference Locator","Universal Reference Link"], answer:0},
{q:"37. Which protocol is used to send email messages?", options:["SMTP","FTP","HTTP","TCP"], answer:0},
{q:"38. Which protocol provides secure communication between browser and website?", options:["HTTP","FTP","HTTPS","SMTP"], answer:2},
{q:"39. Which of the following is a search engine?", options:["Google","Windows","MS Word","Linux"], answer:0},
{q:"40. What does WWW stand for?", options:["World Wide Web","Wide World Web","Web Wide World","World Web Window"], answer:0},

{q:"41. Which symbol is mandatory in an email address?", options:["#","@","&","$"], answer:1},
{q:"42. CC in email stands for:", options:["Carbon Copy","Computer Copy","Control Copy","Central Copy"], answer:0},
{q:"43. BCC in email stands for:", options:["Blind Carbon Copy","Browser Carbon Copy","Binary Carbon Copy","Basic Carbon Copy"], answer:0},
{q:"44. Which of the following is a social networking site?", options:["WhatsApp","Facebook","Excel","Paint"], answer:1},
{q:"45. Which Indian digital payment system uses a UPI ID?", options:["RTGS","Demand Draft","UPI","Cheque"], answer:2},

{q:"46. The main objective of e-Governance is to:", options:["Increase paperwork","Reduce digital services","Provide government services electronically","Replace the Internet"], answer:2},
{q:"47. Which portal is commonly used for online government services in India?", options:["DigiLocker","Paint","Notepad","VLC"], answer:0},
{q:"48. Which of the following is an example of cloud storage?", options:["Google Drive","MS Paint","Calculator","Notepad"], answer:0},
{q:"49. Which payment app commonly uses UPI services?", options:["PhonePe","Paint","WordPad","Notepad"], answer:0},
{q:"50. Which practice improves cyber security?", options:["Sharing passwords","Clicking unknown links","Using strong passwords","Ignoring updates"], answer:2}

];
let currentQuestion=0;
let userAnswers=new Array(questions.length).fill(null);
let visited=new Array(questions.length).fill(false);

function startExam(){
    const first = document.getElementById("firstName").value.trim();
    const last = document.getElementById("lastName").value.trim();

    if(first === "" || last === ""){ 
        alert("Enter First & Last Name"); 
        return; 
    }

    // Store in localStorage for result page
    localStorage.setItem("firstName", first);
    localStorage.setItem("lastName", last);

    document.getElementById("studentName").innerText = first + " " + last;
    document.getElementById("startPage").style.display = "none";
    document.getElementById("quizPage").style.display = "block";

    startTimer();
    loadQuestion();
}


function startTimer(){
    timerInterval=setInterval(()=>{
        let m=Math.floor(timeLeft/60);
        let s=timeLeft%60;
        document.getElementById("timer").innerText=`${m}:${s<10?"0"+s:s}`;
        timeLeft--;
        if(timeLeft<0){ clearInterval(timerInterval); submitQuiz(); }
    },1000);
}

function loadQuestion(){
    visited[currentQuestion]=true;
    document.getElementById("question").innerText=questions[currentQuestion].q;

    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    questions[currentQuestion].options.forEach((opt,i)=>{
        const checked=userAnswers[currentQuestion]===i?"checked":"";        
        optDiv.innerHTML+=`
        <label>
            <input type="radio" name="option" value="${i}" ${checked}>
            <span>${opt}</span>
        </label>`;
    });

    updateSidebar();
}

function saveAnswer(){
    const selected=document.querySelector('input[name="option"]:checked');
    if(selected) userAnswers[currentQuestion]=parseInt(selected.value);
}

function nextQuestion(){ saveAnswer(); if(currentQuestion<questions.length-1){currentQuestion++; loadQuestion();} }
function prevQuestion(){ saveAnswer(); if(currentQuestion>0){currentQuestion--; loadQuestion();} }

function updateSidebar(){
    const container=document.getElementById("questionNumbers");
    container.innerHTML="";
    questions.forEach((_,i)=>{
        let cls="q-number";
        if(userAnswers[i]!==null) cls+=" answered";
        else if(visited[i]) cls+=" skipped";
        container.innerHTML+=`<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;
    });
}

function goTo(i){ saveAnswer(); currentQuestion=i; loadQuestion(); }

function submitQuiz(){
    saveAnswer(); clearInterval(timerInterval);
    let score=0;
    questions.forEach((q,i)=>{ if(userAnswers[i]===q.answer) score++; });
    localStorage.setItem("score",score);
    localStorage.setItem("total",questions.length);
    localStorage.setItem("answers",JSON.stringify(userAnswers));
    localStorage.setItem("questions",JSON.stringify(questions));
    window.location.href="result.html";
}

document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ alert("Tab changed! Exam submitted."); submitQuiz(); }
});
</script>

</body>
</html>
